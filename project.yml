name: AdaDostu
options:
  bundleIdPrefix: com.adadostu
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  AdaDostu:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adadostu.personal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: AdaDostu
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AdaDostu
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UIAppFonts: [AdaCat.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.adadostu.personal
            CFBundleURLSchemes: [adadostu]
    dependencies:
      - target: AdaDostuIsland
        embed: true
  AdaDostuIsland:
    type: app-extension
    platform: iOS
    sources:
      - Island
      - Shared
      - path: Resources
        buildPhase: resources
        excludes: [Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adadostu.personal.island
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Island/Info.plist
      properties:
        CFBundleDisplayName: AdaDostu Adası
        UIAppFonts: [AdaCat.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  AdaDostuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: AdaDostu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.adadostu.personal.uitests
        TEST_TARGET_NAME: AdaDostu
schemes:
  AdaDostu:
    build:
      targets:
        AdaDostu: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets: [AdaDostuUITests]
